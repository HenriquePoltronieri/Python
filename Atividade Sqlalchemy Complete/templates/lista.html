<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
</head>
<body>
    <h1>Alunos cadastrados</h1>

    <p><a href="{{ url_for('cadastrar') }}">+ Cadastrar novo aluno</a></p>

    {% if alunos %}
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        {% for aluno in alunos %}
        <tr>
            <td>{{ aluno.id }}</td>
            <td>{{ aluno.nome }}</td>
            <td>{{ aluno.email }}</td>
            <td>
                <a href="{{ url_for('editar', aluno_id=aluno.id) }}">Editar</a>
                <form action="{{ url_for('excluir', aluno_id=aluno.id) }}" method="POST" style="display:inline">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>Nenhum aluno cadastrado.</p>
    {% endif %}
</body>
</html>
